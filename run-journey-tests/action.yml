name: Run Batteries Journey Tests (run-journey-tests path)
description: Delegates to the root action.yml of DEFRA/batteries-journey-tests

# Kept because the CDP template points service repos at
#   uses: DEFRA/batteries-journey-tests/run-journey-tests@main
# Prefer `uses: DEFRA/batteries-journey-tests@main`. Keep inputs in sync with
# the root action.yml.

inputs:
  waste-batteries-reg-frontend-tag:
    required: false
    default: latest
  waste-batteries-submit-frontend-tag:
    required: false
    default: latest
  waste-batteries-obligations-fe-tag:
    required: false
    default: latest
  waste-batteries-reg-backend-tag:
    required: false
    default: latest
  waste-batteries-submit-backend-tag:
    required: false
    default: latest
  waste-batteries-obligations-be-tag:
    required: false
    default: latest
  browser:
    required: false
    default: chromium
  profile:
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: DEFRA/batteries-journey-tests@main
      with:
        waste-batteries-reg-frontend-tag: ${{ inputs.waste-batteries-reg-frontend-tag }}
        waste-batteries-submit-frontend-tag: ${{ inputs.waste-batteries-submit-frontend-tag }}
        waste-batteries-obligations-fe-tag: ${{ inputs.waste-batteries-obligations-fe-tag }}
        waste-batteries-reg-backend-tag: ${{ inputs.waste-batteries-reg-backend-tag }}
        waste-batteries-submit-backend-tag: ${{ inputs.waste-batteries-submit-backend-tag }}
        waste-batteries-obligations-be-tag: ${{ inputs.waste-batteries-obligations-be-tag }}
        browser: ${{ inputs.browser }}
        profile: ${{ inputs.profile }}
