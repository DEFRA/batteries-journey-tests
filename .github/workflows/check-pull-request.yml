name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  cdp-workflows:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  # Depends-On lines in this PR's description pick the service branches to
  # build; without them the published DockerHub images (main) are used.
  journey-tests:
    name: Run Journey Tests
    uses: ./.github/workflows/journey-tests.yml
    secrets: inherit
    # A called workflow cannot hold more permissions than its caller grants.
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
