name: Check Pull Request

on:
  # No `branches` filter: `pull_request` filters on the base branch, so listing
  # only `main` skips stacked PRs (feature → feature). `edited` covers a base
  # change, which GitHub does not send as `synchronize`.
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
  # Manual run from the Actions tab (pick the branch). The button only appears
  # once this trigger is on the default branch. A run checks out that branch's
  # tip, so the checks show on a PR whose head is that commit. A manual run has
  # no pull request body, so Depends-On lines are not read.
  workflow_dispatch:

jobs:
  cdp-workflows:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  # Depends-On lines in this PR's description pick the service branches to
  # build; without them the published DockerHub images (main) are used.
  journey-tests:
    name: Run Journey Tests
    uses: ./.github/workflows/journey-tests.yml
    secrets: inherit
    # A called workflow cannot hold more permissions than its caller grants.
    permissions:
      contents: read
      checks: write
      pull-requests: write
      id-token: write
